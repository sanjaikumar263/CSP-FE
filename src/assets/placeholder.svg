<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E1C"/>
      <stop offset="50%" stop-color="#0E1614"/>
      <stop offset="100%" stop-color="#090E0D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B88E28"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="560" height="760" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>
  <g transform="translate(300, 360)" text-anchor="middle">
    <!-- Hanger / Dress Icon -->
    <path d="M-40,-30 C-40,-50 -20,-60 0,-60 C20,-60 40,-50 40,-30 C40,-20 20,-10 0,-10 C-20,-10 -40,-20 -40,-30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>
    <path d="M-60,10 L0,-40 L60,10 C70,18 65,30 50,30 L-50,30 C-65,30 -70,18 -60,10 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>
    <path d="M-30,30 L-45,100 L45,100 L30,30 Z" fill="url(#goldGrad)" opacity="0.15"/>
    <text y="150" font-family="'Cinzel', 'Playfair Display', serif" font-size="22" font-weight="600" fill="#E5C158" letter-spacing="3" opacity="0.85">CHENNAI SILK PALACE</text>
    <text y="180" font-family="sans-serif" font-size="14" fill="#A0B0A8" letter-spacing="2" opacity="0.6">IMAGE COMING SOON</text>
